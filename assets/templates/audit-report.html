<!--
  Audit Report template — consumed by js/report.js via DocumentEngine.getTemplate().

  Edit the wording/markup below freely; changes take effect on next reload,
  no JS edit needed. Placeholders use the same {{token}} convention as the
  firm's Word templates (see assets/templates/bm-agm-minutes.docx).

  What you CAN change here: any wording, HTML structure, or CSS classes
  (classes are styled in css/styles.css, also editable independently).

  What NOT to touch, or the report will break:
  - {{token}} names — report.js looks these up by exact name.
  - The two <template id="..."> wrapper tags themselves (tpl-cover, tpl-report).
  - The <!--EOM:START/END--> and <!--KAM:START/END--> comment markers — these
    mark the "Emphasis of Matter" / "Key Audit Matters" sections, which
    report.js shows or hides based on the checkboxes in the UI. You can edit
    the wording *inside* them freely, just don't remove the marker comments.
-->

<template id="tpl-cover">
  <div class="rep-sheet rep-cover" contenteditable="true" spellcheck="false">
    <div class="rep-cover-frame">
      <div class="rep-cover-title">Audit Report</div>
      <div class="rep-cover-of">Of</div>
      <div class="rep-cover-entity">{{entityName}}</div>
      <div class="rep-cover-address">{{entityAddress}}</div>
      <div class="rep-cover-fy">For the Year Ending {{fyBs}}</div>

      <div class="rep-cover-lines" aria-hidden="true">
        <span class="rep-cover-line rep-cover-line--sm"></span>
        <span class="rep-cover-line rep-cover-line--lg"></span>
        <span class="rep-cover-line rep-cover-line--md"></span>
      </div>

      <div class="rep-cover-auditedby">Audited By:</div>
      <div class="rep-cover-firm">{{firmName}}</div>
      <div class="rep-cover-firmtitle">{{firmTitle}}</div>
    </div>
  </div>
</template>

<template id="tpl-report">
  <div class="rep-sheet" contenteditable="true" spellcheck="false">
    <div class="rep-firm-header">
      {{firmIdentityHtml}}
      <div class="rfaddr">{{firmAddress}}</div>
    </div>
    <div class="rep-contact-row">
      <div class="rep-contact-col">
        <p>Email:- {{firmEmail}}</p>
        <p>Phone no:- {{firmPhone}}</p>
        <p>Firm Registration No. {{firmRegNo}}</p>
      </div>
      <div class="rep-contact-col">
        <p>M.No. {{firmMNo}}</p>
        <p>PAN:- {{firmPan}}</p>
        <p>COP No. {{firmCopNo}}</p>
      </div>
    </div>

    <div class="rep-title">Independent Auditor's Report</div>
    <p class="rep-salutation">To {{salutationTo}} <strong>{{entityName}}</strong></p>

    <h3 class="rep-sec"><span class="rep-section-num">{{n1}}</span> Report on the Audit of Financial Statement:</h3>
    <p><strong>Opinion:</strong></p>
    <p>We have audited the accompanying financial statements of {{entityName}}, which comprises the Statement of Financial Position as at {{fyBs}} ({{fyAd}}) and the Statement of Income for the year then ended, Statements of Change in Equity and Statement of Cash Flow and a Summary of Significant Accounting Policies and Other Explanatory Information.</p>
    <p>In our opinion, the accompanying financial statements present fairly in material respect. The financial position of the {{entityNoun}} as at {{fyBs}} ({{fyAd}}), its financial performance and its cash flows for the year then ended has been prepared in accordance with {{nas}}.</p>

    <p><strong>Basis of Opinion:</strong></p>
    <p>We conducted our audit in accordance with {{nas}}. Our responsibilities under those standards are further described in the Auditor's Responsibilities for the Audit of the Financial Statements section of our report. We are independent of the {{entityNoun}} in according to ICAN's Handbook of Code of Ethics for Professional Accountants. We believe that the audit evidence we have obtained is sufficient and appropriate to provide a basis for our opinion.</p>

    <!--EOM:START-->
    <div class="rep-optional-block">
      <p><strong>Emphasis of Matter:</strong></p>
      <div class="rep-blank-fill" contenteditable="true" data-placeholder="Type the Emphasis of Matter paragraph here&hellip;"></div>
    </div>
    <!--EOM:END-->

    <!--KAM:START-->
    <div class="rep-optional-block">
      <h3 class="rep-sec"><span class="rep-section-num">{{nKAM}}</span> Key Audit Matters:</h3>
      <p class="rep-blank-fill" contenteditable="true" style="min-height:auto;" data-placeholder="Key audit matters are those matters that, in our professional judgment, were of most significance in our audit of the financial statements of the current period. Based on the circumstances and facts of the audit, we consider following as key audit matters:"></p>
      <table class="rep-kam-table">
        <tr>
          <th style="width:6%">S.N.</th>
          <th style="width:44%">Details of Key Audit Matters</th>
          <th style="width:50%">How the matters were addressed in our audit</th>
        </tr>
        <tr>
          <td class="rep-sn-col">1</td>
          <td class="rep-blank-fill" contenteditable="true" data-placeholder="Heading + reference note&hellip;"></td>
          <td class="rep-blank-fill" contenteditable="true" data-placeholder="Audit procedures&hellip;"></td>
        </tr>
        <tr>
          <td class="rep-sn-col"></td>
          <td class="rep-blank-fill" contenteditable="true" data-placeholder="Description of the matter&hellip;"></td>
          <td class="rep-blank-fill" contenteditable="true" data-placeholder="How addressed&hellip;"></td>
        </tr>
      </table>
    </div>
    <!--KAM:END-->

    <h3 class="rep-sec"><span class="rep-section-num">{{n2}}</span> Responsibilities of the Management and Those Charged with Governance for the Financial Statements:</h3>
    <p>The {{entityNounCap}}'s management is responsible for the preparation and fair presentation of these financial statements in accordance with {{nas}} and for such internal control as management determines is necessary to enable the preparation of financial statements that are free from material misstatements, whether due to fraud or error.</p>
    <p>In preparing the financial statements, management is responsible for assessing the {{entityNoun}}'s ability to continue as going concern, disclosing, as applicable, matters related to going concern basis of accounting unless management either intends to liquidate the {{entityNoun}} or to cease operations, or has no realistic alternative but to do to so. Those charged with governance are responsible for overseeing the {{entityNoun}}'s financial reporting process.</p>

    <h3 class="rep-sec"><span class="rep-section-num">{{n3}}</span> Auditor's Responsibility for Audit of the Financial Statements:</h3>
    <p>Our objective is to obtain reasonable assurance about whether the financial statements as a whole are free from material misstatements, whether due to fraud or error, and to issue an Auditor's Report that includes our opinion. Reasonable assurance is high level of assurance; but is not guarantee that an audit conducted in accordance with {{nas}} will always detect a material misstatements when it exists. Misstatements can arise from fraud or error, and are considered material if, individually or taken together, they could reasonably be expected to influence the economic decisions of users taken on the basis these financial statements.</p>
    <p>As part of the audit accordance with NAS, we exercise professional judgement and maintain professional scepticism throughout the audit. We also;</p>
    <ul class="rep-audit-points">
      <li>Identify and assess the risk of material misstatements of the financial statements, whether due to fraud or error, design and perform audit procedures responsive to those risks, and obtain audit evidence that is sufficient and appropriate to provide a basis for our opinion. The risk of not detecting a material misstatement resulting from fraud is higher that for one resulting from error, as fraud may involve collusion, forgery, intentional omissions, misrepresentations, or override of internal control.</li>
      <li>Obtain an understanding of internal control relevant to the audit in order to design audit procedures that are appropriate in the circumstances, but not for expressing an opinion on the effectiveness of the {{entityNoun}}'s internal control.</li>
      <li>Evaluate the appropriateness of accounting policies used and the reasonableness of accounting estimates and related disclosure made by the management.</li>
      <li>Conclude on the appropriateness of management's use of the going concern basis of accounting and, based on the audit evidence obtained, whether a material uncertainty exists, we are required to draw attention in our auditor's report to the related disclosures in the financial statements, or if such disclosures are inadequate, to modify our opinion. Our conclusions are based on the audit evidence obtained up to date of our auditor's report. However, further events or conditions may cause the {{entityNoun}} to cease to continue as a going concern.</li>
    </ul>
    <p>We communicate with Those Charged with Governance regarding among other matters, the planned scope and timing of the audit and significant audit finding including any significant deficiencies in internal control that are identify during our audit.</p>

    <h3 class="rep-sec"><span class="rep-section-num">{{n4}}</span> Report on Other Legal and Regulatory Requirements:</h3>
    <p>We have obtained information and explanation asked for, which, to the best of our knowledge and belief, were necessary for the purpose of our audit. In our opinion, Statement of Financial Position, Statement of Income, Statement of Change in Equity and Statement of Cash Flows, have been prepared in accordance with the requirement of {{act}} and are in agreement with the books of accounts maintained by the {{entityNoun}} and proper books of account as required by the law maintained by the {{entityNoun}} have been kept so far as it appears form our examination of those books and records of the {{entityNoun}}.</p>
    <p>In our opinion, so far as it appeared from our examination of the books, the {{entityNoun}} has maintained adequate capital funds and adequate provisions for possible impairment of assets in accordance with the applicable laws.</p>
    <p>To the best of our information and according to explanation given to us and so far spread from our examination of the books of accounts of the {{entityNoun}}, we have not come across cases where {{governingBodyShort}} or any employee of the {{entityNoun}} have acted contrary to the provisions of the laws relating to accounts, or committed any misappropriation or caused loss or damage to the {{entityNoun}} and violated any directives issued by the regulatory authorities or acted in a manner to jeopardise the interest and security of the {{entityNoun}}, its creditors and {{creditorsAndWord}}.</p>

    <div class="rep-sig-block">
      <div class="rep-sig-left">
        <p>Date: {{reportDate}}</p>
        <p>Place: {{reportPlace}}</p>
        <p class="rep-udin">{{udinLine}}</p>
      </div>
      <div class="rep-sig-right">
        <p>{{firmName}}</p>
        <p>Firm Registration No. {{firmRegNo}}</p>
        <p>{{firmTitle}}</p>
        <p class="rname">{{signatoryName}}</p>
        <p>{{signatoryTitle}}</p>
        <p>M.No. {{firmMNo}}</p>
        <p>PAN:- {{firmPan}}</p>
        <p>COP No. {{firmCopNo}}</p>
      </div>
    </div>
  </div>
</template>
